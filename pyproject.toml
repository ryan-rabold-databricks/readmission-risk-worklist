[project]
name = "readmit"
version = "0.1.0"
description = "Readmission Prevention Worklist - shared library and job entry points"
requires-python = ">=3.11"
dependencies = ["databricks-sdk>=0.81.0"]

[project.optional-dependencies]
ml = ["xgboost==2.1.4", "scikit-learn==1.6.1", "mlflow==3.1.0", "matplotlib"]
lakebase = ["psycopg[binary]==3.2.9"]
dev = ["pytest>=8", "pyspark>=3.5"]

[project.scripts]
simulate = "readmit.simulator.main:main"
train = "readmit.ml.train:main"
score = "readmit.ml.score:main"
build_worklist = "readmit.worklist.build:main"
backfill_program = "readmit.worklist.backfill:main"
setup_lakebase = "readmit.lakebase.setup:main"
publish_worklist = "readmit.lakebase.publish:main"
simulate_outreach = "readmit.lakebase.outreach_sim:main"
setup_governance = "readmit.governance.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readmit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
