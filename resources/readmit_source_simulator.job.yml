# Demo only: simulates the nightly EHR extract. The first run backfills history from
# history_start; each later run lands only the missing days through run_date.

resources:
  jobs:
    readmit_source_simulator:
      name: ${var.env}_readmit_source_simulator
      description: Lands synthetic daily EHR extracts (JSON lines) into ehr_raw.ehr_landing. Idempotent.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: America/Chicago
      parameters:
        - name: history_start
          default: "2024-11-01"
        - name: run_date
          default: ""
      tasks:
        - task_key: land_ehr_extracts
          environment_key: simulator
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: readmit
            entry_point: simulate
            parameters:
              - --env=${var.env}
              - --catalog=${var.catalog}
              - --history-start={{job.parameters.history_start}}
              - --run-date={{job.parameters.run_date}}
              - --avg-readmission-cost=${var.avg_readmission_cost}
      environments:
        - environment_key: simulator
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
