# Worklist synced to Lakebase for the app (DECISIONS.md #9, #40, #46). The UC schema
# readmission_worklist_gold becomes the Postgres schema of the same name; tables are
# read-only in Postgres. Source is the minimum-necessary view care_worklist_active
# (care-manager columns, latest 30 worklist days). SNAPSHOT: the daily cycle's
# publish_worklist task refreshes it after build_worklist; rows that age out of the
# window leave Postgres on the next refresh.

resources:
  postgres_synced_tables:
    care_worklist_synced:
      synced_table_id: ${var.catalog}.readmission_worklist_gold.care_worklist_synced
      source_table_full_name: ${var.catalog}.readmission_worklist_gold.care_worklist_active
      primary_key_columns:
        - worklist_item_id
      scheduling_policy: SNAPSHOT
      branch: ${resources.postgres_projects.readmission_worklist.name}/branches/${var.lakebase_branch}
      postgres_database: ${resources.postgres_databases.readmission_worklist_db.postgres_database}
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${resources.schemas.readmission_worklist_sync_internal.name}
