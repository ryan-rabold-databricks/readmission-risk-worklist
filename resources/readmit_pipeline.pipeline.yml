# Lakeflow Spark Declarative Pipeline: ehr_bronze -> clinical_silver /
# care_management_silver -> readmission_worklist_gold. Runs as the ingest_curate task of
# <env>_readmit_daily_cycle once that job exists (Phase 3).

resources:
  pipelines:
    readmit_pipeline:
      name: ${var.env}_readmit_pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.ehr_bronze.name}
      serverless: true
      continuous: false
      channel: CURRENT
      # root_path is on sys.path when pipeline sources run, so they import the readmit
      # package (rules, schemas, code tables) straight from the deployed bundle files.
      # A wheel dependency is not used: the bundle does not rewrite pipeline dependency
      # paths to the per-deploy dynamic wheel version, so the pipeline would run stale code.
      root_path: ../src
      libraries:
        - glob:
            include: ../src/pipeline/transformations/**
      configuration:
        readmit.env: ${var.env}
        readmit.catalog: ${var.catalog}
        readmit.pipeline_name: ${var.env}_readmit_pipeline
        readmit.landing_path: /Volumes/${var.catalog}/ehr_raw/ehr_landing
        readmit.seeds_path: ${workspace.file_path}/seeds
