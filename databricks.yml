# Readmission Prevention Worklist - Declarative Automation Bundle.
# One bundle deploys every asset per environment; each target reads and writes
# only its own catalog and Lakebase project (see docs/DECISIONS.md).

bundle:
  name: readmission_worklist

include:
  - resources/*.yml

sync:
  # Only runtime code goes to the workspace.
  exclude:
    - docs/**
    - evidence/**
    - tests/**
    - .isaac/**
    - src/app/node_modules/**
    - src/app/dist/**
    - src/app/client/dist/**
    - src/app/.env

artifacts:
  readmit_wheel:
    type: whl
    build: uv build --wheel
    path: .
    # Unique wheel version per deploy, so serverless jobs and pipelines never reuse a
    # cached install of an older build with the same version.
    dynamic_version: true

variables:
  env:
    description: Environment name used in job names and the environment guardrail.
  catalog:
    description: Unity Catalog catalog that holds every schema for this solution.
  lakebase_project:
    description: Lakebase project ID (hyphens only).
    default: readmission-worklist
  lakebase_database:
    description: Lakebase Postgres database name (underscores only).
    default: readmission_worklist
  lakebase_database_id:
    description: Lakebase database resource ID (hyphens only) for lakebase_database.
    default: readmission-worklist
  lakebase_branch:
    description: Lakebase branch that serves the app.
    default: production
  lakebase_owner_role:
    description: Lakebase role ID that owns the database (the deploying identity's role).
  lakebase_max_cu:
    description: Autoscaling ceiling for the Lakebase primary endpoint (compute units).
    default: 2
  llm_endpoint:
    description: Foundation Model endpoint used by ai_query for outreach briefs.
    default: databricks-claude-opus-5-5
  program_go_live:
    description: First worklist day of the readmission prevention program (backfill start).
    default: "2026-05-01"
  brief_days:
    description: Outreach briefs (ai_query) are drafted for the most recent N worklist days only.
    default: "14"
  avg_readmission_cost:
    # Rough estimate based on AHRQ HCUP Statistical Brief #248: average 30-day all-cause
    # readmission cost $14,400 in 2016 (hospital cost, all payers). Each customer should
    # set their own cost per readmission when deploying (DECISIONS.md #59).
    description: Assumed cost of one readmission (USD) for estimated cost avoided. Rough estimate from HCUP SB #248; set the customer's own figure per target.
    default: "15000"
  leadership_group:
    description: Workspace group for Care Management Leadership (Program Settings access; sees every facility under the ABAC row filter).
    default: care_mgmt_leadership
  warehouse_max_clusters:
    description: Upper bound for warehouse scale-out (1 for single-developer dev; raise for concurrent demo or prod use).
    default: 1
  service_principal_id:
    description: Application ID of the service principal that runs prod workloads.
    default: ""

targets:
  dev:
    # No "mode: development": it prefixes UC schemas with dev_<user>_ even when
    # presets.name_prefix is empty, which breaks the UC-to-Postgres schema mapping
    # (DECISIONS.md #8). The development-mode behaviors we want are set explicitly.
    default: true
    workspace:
      host: https://fevm-classic-stable-v61z4f.cloud.databricks.com
    presets:
      trigger_pause_status: PAUSED
      pipelines_development: true
      jobs_max_concurrent_runs: 1
      tags:
        env: dev
    variables:
      env: dev
      catalog: rtr_demo_catalog
      lakebase_owner_role: ryan-rabold

  prod:
    mode: production
    # Workspace host comes from --profile so the prod workspace is never hard-coded here.
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prod
      catalog: prod_care_management
      warehouse_max_clusters: 2
      lakebase_max_cu: 4
      # Set to the Lakebase role ID of the prod service principal.
      lakebase_owner_role: ""
    run_as:
      service_principal_name: ${var.service_principal_id}
